name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 — code quality. Fails fast on formatting / lint / import issues so we
  # never spin up a database for code that doesn't meet the bar.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install ruff
        run: pip install -r requirements-dev.txt
      - name: ruff check (lint — unused vars, imports, bugbear, pyupgrade)
        run: ruff check --output-format=github .
      - name: ruff format (verify formatting)
        run: ruff format --check .

  # ---------------------------------------------------------------------------
  # Gate 2 — migrations + the full verification suite against a live pgvector
  # service container. Runs only if lint passed.
  # ---------------------------------------------------------------------------
  test:
    name: Migrations & test suite
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: company_brain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d company_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # Connect to the service container mapped onto the runner's localhost.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: brain
      POSTGRES_DB: company_brain
      # Offline LLM — deterministic embeddings, no Azure spend in CI.
      LLM_PROVIDER: stub
      # Make `app` and `tests` importable from the repo root.
      PYTHONPATH: ${{ github.workspace }}
      # Keep the connector 429-backoff test fast.
      HTTP_BACKOFF_BASE_SECONDS: "0.01"
      HTTP_BACKOFF_MAX_SECONDS: "0.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply Alembic migrations (python -m app.db.init_db)
        run: python -m app.db.init_db
      - name: Run the test suite (unit + integration against live pgvector)
        run: pytest tests/ -v
