# Alembic configuration. The database URL is intentionally left blank here and
# injected at runtime from app/config.py (env.py), so credentials are never
# hardcoded in the repo.

[alembic]
script_location = alembic
prepend_sys_path = .
# version_path_separator = os
sqlalchemy.url =

# ---------------------------------------------------------------------------
# Logging — handlers write to stderr (keeps stdout clean for any stdio tooling).
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
